name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'TANKR Multi-Platform Production Release'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web Production SPA
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://qicoczialqxulcbipuix.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpY29jemlhbHF4dWxjYmlwdWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzI3OTMsImV4cCI6MjEwODk0ODc5M30.aTT8i9UAydWN33n0SrlZKBmPCgYBmdizgSENAPLfR6Q' }}
      EXPO_PUBLIC_MAPPLS_REST_KEY: 'bxtphoyagzpyhhukdfjunqunpqibgugplcdc'
      EXPO_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_TuCCnOeHyd9KdO'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Web SPA Bundle
        run: npx expo export -p web --output-dir dist-web

      - name: Package Web Distribution Archive
        run: |
          cd dist-web
          zip -r ../tankr-web-production.zip .
          cd ..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tankr-web
          path: tankr-web-production.zip

      - name: Upload Raw Web Directory for Desktop Build
        uses: actions/upload-artifact@v4
        with:
          name: raw-dist-web
          path: dist-web/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://qicoczialqxulcbipuix.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpY29jemlhbHF4dWxjYmlwdWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzI3OTMsImV4cCI6MjEwODk0ODc5M30.aTT8i9UAydWN33n0SrlZKBmPCgYBmdizgSENAPLfR6Q' }}
      EXPO_PUBLIC_MAPPLS_REST_KEY: 'bxtphoyagzpyhhukdfjunqunpqibgugplcdc'
      EXPO_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_TuCCnOeHyd9KdO'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Android Hermes Bundle
        run: |
          npx expo export -p android --output-dir dist-android
          cd dist-android && zip -r ../tankr-android-bundle.zip . && cd ..

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Installable APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk tankr-android-installable.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tankr-android-apk
          path: tankr-android-installable.apk

      - name: Upload Android Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tankr-android-bundle
          path: tankr-android-bundle.zip

  build-ios:
    name: Build iOS Package
    runs-on: macos-14
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://qicoczialqxulcbipuix.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpY29jemlhbHF4dWxjYmlwdWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzI3OTMsImV4cCI6MjEwODk0ODc5M30.aTT8i9UAydWN33n0SrlZKBmPCgYBmdizgSENAPLfR6Q' }}
      EXPO_PUBLIC_MAPPLS_REST_KEY: 'bxtphoyagzpyhhukdfjunqunpqibgugplcdc'
      EXPO_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_TuCCnOeHyd9KdO'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export iOS Hermes Bundle
        run: |
          npx expo export -p ios --output-dir dist-ios
          cd dist-ios && zip -r ../tankr-ios-bundle.zip . && cd ..

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Simulator App (Xcodebuild)
        run: |
          cd ios
          xcodebuild -workspace TANKR.xcworkspace \
                     -scheme TANKR \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../tankr-ios-simulator.zip TANKR.app
          cd ../../../../..

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: tankr-ios-app
          path: tankr-ios-simulator.zip

      - name: Upload iOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tankr-ios-bundle
          path: tankr-ios-bundle.zip

  build-desktop-macos:
    name: Build macOS DMG & App
    runs-on: macos-14
    needs: [build-web]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Raw Web Distribution
        uses: actions/download-artifact@v4
        with:
          name: raw-dist-web
          path: desktop/dist-web

      - name: Build macOS DMG
        run: |
          cd desktop
          npm install --save-dev electron electron-builder
          npx electron-builder --mac dmg zip
          cd ..
          mkdir -p release-mac
          cp desktop/dist-desktop/*.dmg release-mac/ || true
          cp desktop/dist-desktop/*.zip release-mac/ || true

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tankr-macos-dmg
          path: release-mac/

  build-desktop-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Raw Web Distribution
        uses: actions/download-artifact@v4
        with:
          name: raw-dist-web
          path: desktop/dist-web

      - name: Build Windows Executable
        run: |
          cd desktop
          npm install --save-dev electron electron-builder
          npx electron-builder --win portable nsis
          cd ..
          mkdir release-win
          Copy-Item desktop/dist-desktop/*.exe release-win/

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tankr-windows-exe
          path: release-win/

  publish-release:
    name: Publish GitHub Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-ios, build-desktop-macos, build-desktop-windows]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Distribution Packages
        run: |
          find downloaded-artifacts -type f \( -name "*.apk" -o -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Determine Release Tag & Title
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }} (${{ github.event.inputs.version }})" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=TANKR Production Multi-Platform Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
