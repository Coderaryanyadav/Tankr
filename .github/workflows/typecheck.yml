name: Static Typecheck

on:
  pull_request:
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'tsconfig.json'
      - 'package.json'

jobs:
  typecheck:
    name: TypeScript Compiler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile with tsc
        run: npx tsc --noEmit
