name: Unit & Regression Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'jest.config.js'
      - 'package.json'

jobs:
  test:
    name: Jest Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --watchAll=false
