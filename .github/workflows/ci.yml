name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Jest Test Suites
        run: npm test -- --watchAll=false

      - name: Verify Secret Leak Protection
        run: |
          if git grep -i "service_role" -- 'src/' >/dev/null 2>&1; then
            echo "::error::Found forbidden 'service_role' reference in src/ directory!"
            exit 1
          fi
          echo "Secret scan passed cleanly."
